[project]
name = "ats-intelligence-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Willane Jaures", email = "89950707+WillaneJaures@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "google>=3.0.0",
    "google-genai>=2.33.0",
    "pandas>=3.1.0",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
